<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trắc nghiệm phong cách tư duy 4 góc phần tư</title>
<style>
:root{--bg:#f6f7f4;--fg:#1d2420;--mu:#5d6761;--card:#fff;--ln:#d9ddd6;--A:#2f6fb5;--B:#3f8f4f;--C:#c4433f;--D:#d99a1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171b19;--fg:#e8ece8;--mu:#9aa49d;--card:#212724;--ln:#38403b;--A:#6aa5e6;--B:#6fc17e;--C:#ec7a76;--D:#f0bb4d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 Georgia,"Times New Roman",serif}
main{max-width:720px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:1.7rem;line-height:1.2;margin:0 0 8px}p{margin:0 0 12px;color:var(--mu)}
.q{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:14px;margin:12px 0}
.q.miss{border-color:var(--C)}.q b{font-weight:600;display:block;margin-bottom:10px;color:var(--fg)}
.s{display:flex;gap:6px}.s label{flex:1;text-align:center;border:1px solid var(--ln);border-radius:8px;padding:8px 0;cursor:pointer;font:600 15px system-ui,sans-serif}
.s input{position:absolute;opacity:0}.s label:has(input:checked){background:var(--fg);color:var(--bg);border-color:var(--fg)}
.s label:has(input:focus-visible){outline:2px solid var(--A);outline-offset:2px}
.sc{display:flex;justify-content:space-between;font:12px system-ui,sans-serif;color:var(--mu);margin-top:4px}
button{font:600 16px system-ui,sans-serif;background:var(--fg);color:var(--bg);border:0;border-radius:8px;padding:12px 22px;cursor:pointer}
#bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;font:14px system-ui,sans-serif;color:var(--mu);z-index:2}
.r{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:14px;margin:12px 0}
.r h3{margin:0 0 6px;font-size:1.05rem}.t{height:12px;background:var(--ln);border-radius:6px;overflow:hidden;margin:6px 0}.t i{display:block;height:100%}
.r span{font:14px system-ui,sans-serif;color:var(--mu)}
</style></head><body><main>
<h1>Trắc nghiệm phong cách tư duy</h1>
<p>Mô hình 4 góc phần tư (tham khảo ý tưởng Whole Brain, không phải bài HBDI chính thức). 120 câu, khoảng 20 phút. Chọn mức độ mỗi câu đúng với bạn: 1 là hoàn toàn không đúng, 5 là rất đúng. Hãy trả lời theo cách bạn thường làm, không theo cách bạn muốn mình như vậy.</p>
<div id="bar"></div><div id="qs"></div>
<button id="go">Xem kết quả</button><div id="res"></div>
</main>
<script>
const Q={A:["Tôi thích phân tích số liệu trước khi quyết định.","Nghe một nhận định, tôi hay hỏi: bằng chứng đâu?","Tôi thích giải các bài toán logic hoặc kỹ thuật.","Tôi tin dữ kiện hơn cảm tính.","Tôi thích tìm hiểu một thứ vận hành ra sao về mặt kỹ thuật.","Tôi diễn đạt ý kiến chính xác và ngắn gọn.","Tôi thích so sánh phương án bằng tiêu chí đo lường được.","Tôi dễ phát hiện lỗ hổng trong lập luận của người khác.","Tôi thích đọc báo cáo, thống kê, tài liệu chuyên sâu.","Tôi giữ bình tĩnh, khách quan khi tranh luận.","Tôi thích tìm nguyên nhân gốc của một vấn đề.","Tôi muốn thấy con số trước khi tin một kết luận.","Tôi thích các môn khoa học tự nhiên và kỹ thuật.","Tôi chia vấn đề phức tạp thành các phần nhỏ để xử lý.","Tôi thích dùng bảng tính hoặc công cụ phân tích.","Tôi ít để cảm xúc chi phối khi chọn phương án.","Tôi thích tìm hiểu sâu một chủ đề cho đến khi nắm rõ.","Tôi thích đánh giá rủi ro bằng xác suất và dữ liệu.","Tôi đọc kỹ thông số trước khi mua đồ đắt tiền.","Tôi thích những cuộc thảo luận dựa trên lý lẽ.","Tôi hay kiểm chứng thông tin trước khi chia sẻ.","Tôi thích sự rõ ràng về định nghĩa và thuật ngữ.","Tôi nghĩ mô hình và công thức giúp hiểu thế giới.","Tôi thích tìm cách tối ưu hiệu quả của một hệ thống.","Tôi phê bình thẳng thắn khi thấy lập luận yếu.","Tôi thích các trò chơi cần tính toán, chiến thuật.","Tôi thường giải thích sự việc bằng lý do cụ thể.","Tôi thích tìm hiểu cách một thiết bị được chế tạo.","Tôi so sánh nhiều nguồn trước khi kết luận.","Tôi thích công việc đòi hỏi suy luận chặt chẽ."],
B:["Tôi lập kế hoạch chi tiết trước khi bắt tay vào việc.","Tôi thích mọi thứ ngăn nắp, có thứ tự.","Tôi làm theo quy trình từng bước cho đến khi xong.","Tôi luôn hoàn thành đúng hạn.","Tôi thích danh sách việc cần làm và đánh dấu từng mục.","Tôi khó chịu khi công việc bị đổi đột ngột.","Tôi kiểm tra kỹ chi tiết để tránh sai sót.","Tôi thích quy tắc rõ ràng và nhất quán.","Tôi quản lý tiền bạc và thời gian một cách có hệ thống.","Tôi thích cách làm đã được kiểm chứng.","Tôi chuẩn bị đồ đạc từ trước khi đi xa.","Tôi thích lịch làm việc cố định mỗi ngày.","Tôi ghi chép cẩn thận để không bỏ sót.","Tôi hoàn thành việc đang làm rồi mới sang việc khác.","Tôi thích sắp xếp tài liệu theo thư mục rõ ràng.","Tôi giữ lời hứa và tuân thủ cam kết.","Tôi thích các bước hướng dẫn cụ thể.","Tôi thường đặt mục tiêu theo từng mốc thời gian.","Tôi khó yên tâm khi chưa có phương án dự phòng.","Tôi thích làm việc theo thói quen quen thuộc.","Tôi để ý khi người khác làm sai quy định.","Tôi thích việc có kết quả rõ ràng, hoàn chỉnh.","Tôi chi tiêu theo ngân sách đã định.","Tôi thích nhà cửa, bàn làm việc gọn gàng.","Tôi đọc kỹ hướng dẫn trước khi dùng sản phẩm mới.","Tôi làm việc đều đặn, ít bỏ dở giữa chừng.","Tôi thích những công việc thực tế, làm được ngay.","Tôi thích dự án được chia giai đoạn rõ ràng.","Tôi thấy thoải mái khi mọi thứ diễn ra đúng kế hoạch.","Tôi thích được giao nhiệm vụ với yêu cầu cụ thể."],
C:["Tôi dễ nhận ra cảm xúc của người khác.","Tôi thích lắng nghe người khác chia sẻ chuyện riêng.","Tôi thích làm việc nhóm hơn làm một mình.","Tôi quan tâm việc mọi người trong nhóm có hòa hợp không.","Tôi thích hướng dẫn, giúp người khác phát triển.","Tôi thể hiện cảm xúc một cách cởi mở.","Tôi tin linh cảm của mình về con người.","Tôi nhớ những dịp đặc biệt của bạn bè, người thân.","Tôi thích kể chuyện và trò chuyện thân mật.","Khi quyết định, tôi tính đến ảnh hưởng lên cảm xúc người khác.","Tôi để ý nét mặt và giọng nói của người đối diện.","Tôi thích động viên người đang gặp khó khăn.","Tôi thấy vui khi cả nhóm cùng thành công.","Tôi dễ đồng cảm với câu chuyện của người khác.","Tôi thích các buổi gặp gỡ, tụ tập bạn bè.","Tôi coi trọng sự gắn bó hơn hiệu quả thuần túy.","Tôi muốn mọi người cảm thấy được tôn trọng.","Tôi thích tình nguyện và hoạt động cộng đồng.","Tôi dễ làm quen với người mới.","Tôi hay trao đổi cảm nhận với người thân.","Tôi thích thuyết trình hoặc nói chuyện trước nhóm.","Tôi buồn khi trong nhóm có mâu thuẫn chưa giải quyết.","Tôi học tốt nhất khi được trao đổi với người khác.","Tôi sẵn lòng dành thời gian giúp bạn bè.","Tôi thích viết thư, nhắn tin hỏi thăm.","Tôi tin rằng mối quan hệ tốt tạo nên kết quả tốt.","Tôi thích âm nhạc và các hoạt động tạo cảm xúc.","Tôi nói chuyện bằng giọng ấm áp, gần gũi.","Tôi dễ cảm nhận được bầu không khí trong phòng.","Tôi thích công việc tiếp xúc, chăm sóc con người."],
D:["Tôi hay nghĩ ra ý tưởng mới, khác thường.","Tôi thích nhìn bức tranh tổng thể hơn chi tiết.","Tôi thích thử nghiệm và chấp nhận rủi ro.","Tôi hay mơ về tương lai.","Tôi nhanh chán những việc lặp đi lặp lại.","Tôi thích hình ảnh, sơ đồ hơn là chữ.","Tôi giải quyết vấn đề bằng cách nhảy sang góc nhìn mới.","Tôi thích khám phá điều chưa ai làm.","Tôi dựa vào trực giác khi chưa đủ thông tin.","Tôi thích linh hoạt, tự do hơn quy trình cố định.","Tôi thích hình dung kết quả trước khi bắt tay làm.","Tôi hay liên tưởng giữa những thứ tưởng như không liên quan.","Tôi thích đặt câu hỏi: nếu làm khác đi thì sao?","Tôi thích nghệ thuật, thiết kế và cái đẹp.","Tôi bị thu hút bởi những xu hướng mới.","Tôi thích nghĩ về tầm nhìn dài hạn.","Tôi sẵn sàng bỏ kế hoạch cũ khi thấy cơ hội mới.","Tôi hay phác hình nguệch ngoạc khi suy nghĩ.","Tôi thích tự do sáng tạo, ít bị ràng buộc.","Tôi dễ nảy ra ý tưởng khi đi dạo hoặc thư giãn.","Tôi thích ý tưởng táo bạo dù chưa chắc thành công.","Tôi thích tóm tắt vấn đề bằng một hình ảnh hay ẩn dụ.","Tôi thích du lịch đến nơi hoàn toàn xa lạ.","Tôi chấp nhận sự mơ hồ khi đang khám phá.","Tôi thích kết hợp nhiều lĩnh vực khác nhau.","Tôi thấy nhàm khi phải làm theo khuôn mẫu.","Tôi thích tưởng tượng và kể chuyện viễn tưởng.","Tôi thường thấy trước hướng đi của sự việc.","Tôi thích đổi mới cách làm quen thuộc.","Tôi hứng thú với những vấn đề chưa có lời giải."]};
const N={A:["Phân tích (xanh dương)","Logic, dữ kiện, số liệu. Bạn muốn hiểu vì sao và đo được cái gì."],B:["Tổ chức (xanh lá)","Kế hoạch, quy trình, chi tiết. Bạn làm việc có trật tự và đáng tin cậy."],C:["Quan hệ (đỏ)","Con người, cảm xúc, giao tiếp. Bạn đọc được không khí và kết nối tốt."],D:["Ý tưởng (vàng)","Tương lai, trực giác, bức tranh lớn. Bạn thích thử cái mới và liên kết ý tưởng."]};
const items=[];for(const k in Q)Q[k].forEach(t=>items.push({k,t}));
for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}
const qs=document.getElementById("qs"),bar=document.getElementById("bar");
items.forEach((it,i)=>{const d=document.createElement("div");d.className="q";d.id="q"+i;
d.innerHTML='<b>'+(i+1)+'. '+it.t+'</b><div class="s">'+[1,2,3,4,5].map(n=>'<label><input type="radio" name="r'+i+'" value="'+n+'">'+n+'</label>').join("")+'</div><div class="sc"><span>Không đúng</span><span>Rất đúng</span></div>';qs.appendChild(d)});
function upd(){bar.textContent="Đã trả lời "+document.querySelectorAll("input:checked").length+" / "+items.length}
qs.addEventListener("change",e=>{e.target.closest(".q").classList.remove("miss");upd()});upd();
document.getElementById("go").onclick=()=>{
const sc={A:0,B:0,C:0,D:0};let miss=null;
items.forEach((it,i)=>{const c=document.querySelector('input[name="r'+i+'"]:checked');const box=document.getElementById("q"+i);
if(!c){box.classList.add("miss");if(!miss)miss=box}else sc[it.k]+=+c.value});
if(miss){miss.scrollIntoView({behavior:"smooth",block:"center"});bar.textContent="Còn câu chưa trả lời (viền đỏ).";return}
const lv=s=>s>=114?"Ưu tiên mạnh":s>=84?"Ưu tiên vừa":"Ít ưu tiên";
const col={A:"var(--A)",B:"var(--B)",C:"var(--C)",D:"var(--D)"};
const order=Object.keys(sc).sort((a,b)=>sc[b]-sc[a]);
let h='<h1 style="margin-top:32px">Kết quả của bạn</h1><p>Mạnh nhất: <b style="color:var(--fg)">'+N[order[0]][0]+'</b>, tiếp theo là '+N[order[1]][0]+'. Điểm mỗi nhóm từ 30 đến 150.</p>';
order.forEach(k=>{h+='<div class="r"><h3>'+N[k][0]+': '+sc[k]+'/150, '+lv(sc[k])+'</h3><div class="t"><i style="width:'+sc[k]/1.5+'%;background:'+col[k]+'"></i></div><span>'+N[k][1]+'</span></div>'});
const P=(k,r)=>{const d={A:[-1,-1],B:[-1,1],C:[1,1],D:[1,-1]}[k];return(100+d[0]*r*.7)+","+(100+d[1]*r*.7)};const ks=["A","D","C","B"];h+='<svg viewBox="0 0 200 200" style="width:100%;max-width:260px;display:block;margin:12px auto"><polygon points="'+ks.map(k=>P(k,80)).join(" ")+'" fill="none" stroke="var(--ln)"/><polygon points="'+ks.map(k=>P(k,sc[k]/150*80)).join(" ")+'" fill="var(--D)" fill-opacity=".35" stroke="var(--fg)"/><text x="6" y="14" fill="var(--A)" font-size="12">A</text><text x="188" y="14" fill="var(--D)" font-size="12">D</text><text x="188" y="196" fill="var(--C)" font-size="12">C</text><text x="6" y="196" fill="var(--B)" font-size="12">B</text></svg>';h+='<p>Đây là bản tự khám phá, không thay thế bài HBDI chính thức do chuyên viên được chứng nhận thực hiện. Mức ưu tiên là sở thích, không phải năng lực.</p><button onclick="location.reload()">Làm lại</button>';
const r=document.getElementById("res");r.innerHTML=h;r.scrollIntoView({behavior:"smooth"})};
</script></body></html>
